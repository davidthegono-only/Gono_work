<!DOCTYPE html>
<html>

<head>
  <title>Preoperacional | Setrans</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      background: #111;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    .container{
      max-width: 600px;
      margin: auto;
      background: #1c1c1c;
      padding: 20px;
      border-radius: 15px;
    }

    input, select, button{
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button{
      background: green;
      color: white;
      font-weight: bold;
    }

  </style>
</head>

<body>

<div class="container">

  <h2>PREOPERACIONAL VEHÍCULO DE CARGA</h2>

  <input type="text" id="conductor" placeholder="Nombre conductor">

  <input type="text" id="placa" placeholder="Placa ABC123">

  <input type="number" id="km" placeholder="Kilometraje actual">

  <select id="autorizador">
    <option value="">Persona que autoriza</option>
    <option>JOSE LUIS MEDINA</option>
    <option>MARIO AGUILAR</option>
    <option>LUIS PEREZ</option>
  </select>

  <button id="enviar">Enviar</button>

</div>

<script>

  const conductor = document.getElementById("conductor");
  const placa = document.getElementById("placa");
  const km = document.getElementById("km");

  // MAYÚSCULAS + TRIM AUTOMÁTICO
  function formatInput(input){
    input.addEventListener("input", function(){
      this.value = this.value.trimStart().toUpperCase();
    });
  }

  formatInput(conductor);
  formatInput(placa);

  // VALIDACIÓN PLACA
  function validarPlaca(valor){
    return /^[A-Z]{3}[0-9]{3}$/.test(valor);
  }

  document.getElementById("enviar").addEventListener("click", function(){

    let kmValue = parseInt(km.value);

    // validación placa
    if(!validarPlaca(placa.value)){
      alert("Placa inválida. Debe ser ABC123");
      return;
    }

    // validación km básico (sin base de datos aún)
    if(kmValue <= 0 || kmValue > 2000000){
      alert("Kilometraje no válido");
      return;
    }

    alert("Formulario válido - enviado");

  });

</script>

</body>
</html>
