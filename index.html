<!DOCTYPE html>
<html>

<head>

  <title>Setrans | Preoperacional</title>
  <link rel="icon" href="img/Favicon-removebg-preview.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      background: linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url('img/Preoperacional.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      color: white;
      font-family: Arial;

      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-direction: column;

      padding: 20px;
    }

    .formulario{
      background: rgba(0,0,0,0.75);
      padding: 20px;
      border-radius: 15px;
      width: 100%;
      max-width: 500px;
      margin-top: 20px;
    }

    input, select, button{
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button{
      background: green;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled{
      background: gray;
      cursor: not-allowed;
    }

    h1, h2, p{
      text-align: center;
    }

  </style>

</head>

<body>

  <h1>PREOPERACIONALES | SETRANSCARGA SAS</h1>

  <h2>Estimados Conductores</h2>

  <p>
    Diligencie el siguiente formulario para continuar con su preoperacional.
  </p>

  <div class="formulario">

    <input type="text" id="conductor" placeholder="Nombre del conductor">

    <input type="text" id="placa" placeholder="Placa del vehículo (ABC123)">

    <select id="tipo">
      <option value="">Tipo de vehículo</option>
      <option>Propio</option>
      <option>Tercero</option>
    </select>

    <h3>Fotos obligatorias</h3>

    <input type="file" accept="image/*" capture="environment" id="foto1">
    <input type="file" accept="image/*" capture="environment" id="foto2">

    <button id="enviar">Enviar Preoperacional</button>

  </div>

  <audio id="clickSound" src="sound/Click.mp3" preload="auto"></audio>

  <script>

    const sound = document.getElementById("clickSound");

    function playSound(){
      sound.currentTime = 0;
      sound.play();
    }

    document.getElementById("enviar").addEventListener("click", function(){

      playSound();

      const placa = document.getElementById("placa").value;

      const foto1 = document.getElementById("foto1").files.length;
      const foto2 = document.getElementById("foto2").files.length;

      if(!placa || foto1 === 0 || foto2 === 0){
        alert("Complete todos los campos y suba mínimo 2 fotos");
        return;
      }

      alert("Preoperacional enviado correctamente");

    });

  </script>

</body>

</html>
