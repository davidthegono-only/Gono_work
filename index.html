<!DOCTYPE html>

<html>

<head>

  <title>Setrans|Preoperacional</title>
  <link rel="icon" href="img/Favicon-removebg-preview.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{background: linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url('img/Preoperacional.png'); background-size: cover; background-position: center; background-repeat: no-repeat; min-height: 100vh; color: white;
      text-align: center; font-family: Arial; display: flex; justify-content: flex-start; padding-top: 40px; align-items: center; flex-direction: column;}
   
.contenedor-botones{display: flex;  gap: 50px;  margin-top: 40px; justify-content: center;  flex-wrap: wrap;}.imagen-boton{  width: 280px; border-radius: 20px; transition: 0.3s; cursor: pointer; box-shadow: 0px 0px 15px rgba(0,0,0,0.5);}
.imagen-boton:hover{ transform: scale(1.05);}  @media(max-width:768px){  h1{    font-size: 35px; } h2{ font-size: 25px;  }  p{ font-size: 20px;  padding: 15px;  }  .imagen-boton{width: 90%; max-width: 300px;}
  .contenedor-botones{ flex-direction: column;  align-items: center;  }

}
    
  </style>

</head>

<body>

  <h1>PREOPERACIONALES | SETRANSCARGA SAS</h1>

  <h2>Estimados Conductores</h2>

  <p>
    ¡Bienvenidos, por favor realicen el preoperacional para que puedan seguir con la programación del viaje!
  </p>

  <div class="contenedor-botones">

  <a href="https://forms.gle/xziwC39ivLZt1ikA6" target="_blank">

    <img 
      src="img/Boton_propios.png"
      class="imagen-boton"
    >

  </a>

  <a href="https://forms.gle/ChtT4hq1fsSRgfov8" target="_blank">

    <img 
      src="img/Boton_terceros.png"
      class="imagen-boton"
    >

  </a>

</div>
  
<audio id="clickSound" src="sound/Click.mp3" preload="auto"></audio>
<script>
  const sound = document.getElementById("clickSound");
  const botones = document.querySelectorAll(".imagen-boton");

  function playSound() {
    sound.currentTime = 0;
    sound.play();
  }

  botones.forEach(btn => {

    btn.addEventListener("mouseenter", playSound);

    btn.addEventListener("click", playSound);

  });
</script>
  
</body>

</html>
